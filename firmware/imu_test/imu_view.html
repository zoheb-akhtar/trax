<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMU Live</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#151515; --mute:#8a8a85; --line:#e7e6e1;
          --x:#e5484d; --y:#30a46c; --z:#3e63dd; --accent:#151515; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.3 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:28px 20px 40px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; }
  h1 { font-size:28px; margin:0; letter-spacing:-0.02em; }
  #status { font-size:14px; color:var(--mute); display:flex; align-items:center; gap:8px; }
  #dot { width:9px; height:9px; border-radius:50%; background:#c9c9c4; }
  #dot.live { background:#30a46c; }
  .grid { display:grid; grid-template-columns: 1.1fr 1fr; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; }
  .stage { height:340px; display:flex; align-items:center; justify-content:center; perspective:900px; }
  .board { width:220px; height:150px; position:relative; transform-style:preserve-3d;
           transition:transform 90ms linear; }
  .face { position:absolute; inset:0; border-radius:12px; background:#1f6f5c;
          box-shadow: inset 0 0 0 3px rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center;
          color:rgba(255,255,255,.85); font-weight:600; font-size:14px; letter-spacing:.08em; }
  .face.top { transform: translateZ(9px); }
  .face.bottom { transform: translateZ(-9px) rotateY(180deg); background:#174f42; }
  .chip { position:absolute; width:46px; height:46px; background:#222; border-radius:6px; left:87px; top:52px;
          transform:translateZ(10px); }
  .arrow { position:absolute; left:50%; top:-34px; transform:translateX(-50%) translateZ(9px);
           font-size:13px; color:var(--mute); font-weight:600; letter-spacing:.06em; }
  .big { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat .k { font-size:13px; color:var(--mute); }
  .stat .v { font-size:34px; font-weight:650; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .stat .v small { font-size:16px; color:var(--mute); font-weight:500; }
  .meter { height:10px; background:#efeee9; border-radius:6px; overflow:hidden; margin-top:6px; }
  .meter > div { height:100%; width:0; background:var(--accent); transition:width 90ms linear; }
  .axes { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px; }
  .axis { font-variant-numeric:tabular-nums; }
  .axis b { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; }
  .axis .num { font-size:20px; font-weight:600; }
  h2 { font-size:15px; margin:0 0 10px; font-weight:600; }
  h2 span { color:var(--mute); font-weight:500; }
  canvas { width:100%; height:170px; display:block; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
  button { font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; border-radius:10px;
           padding:8px 14px; cursor:pointer; }
  button:hover { border-color:#cfcfca; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; }
  .hint { color:var(--mute); font-size:13px; }
  .shake { transition: background .2s; }
  .shake.on { background:#fff4e5; border-color:#ffd8a8; }
  @media (max-width:820px) { .grid, .charts { grid-template-columns:1fr; } .big { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>IMU Live</h1>
    <div id="status"><span id="dot"></span><span id="statustext">connecting…</span></div>
  </header>

  <div class="grid">
    <section class="card">
      <div class="stage">
        <div class="board" id="board">
          <div class="arrow">▲ FRONT (+X)</div>
          <div class="face bottom"></div>
          <div class="face top">MPU6050</div>
          <div class="chip"></div>
        </div>
      </div>
      <div class="row">
        <span class="hint">Tilt from gravity, turn from the gyro (turn drifts slowly)</span>
        <button id="zero">Zero</button>
      </div>
    </section>

    <section class="card">
      <div class="big">
        <div class="stat"><div class="k">Tilt left/right</div><div class="v" id="roll">0<small>°</small></div></div>
        <div class="stat"><div class="k">Tilt fwd/back</div><div class="v" id="pitch">0<small>°</small></div></div>
        <div class="stat"><div class="k">Turn</div><div class="v" id="yaw">0<small>°</small></div></div>
        <div class="stat"><div class="k">Rotation speed</div><div class="v" id="spin">0<small>°/s</small></div>
          <div class="meter"><div id="spinbar"></div></div></div>
        <div class="stat shake" id="shakebox"><div class="k">Shake</div><div class="v" id="shake">0.00<small>g</small></div>
          <div class="meter"><div id="shakebar"></div></div></div>
        <div class="stat"><div class="k">Temperature</div><div class="v" id="temp">–<small>°C</small></div></div>
      </div>
      <div class="axes" id="gaxes"></div>
      <div class="axes" id="aaxes"></div>
    </section>
  </div>

  <div class="charts">
    <section class="card"><h2>Gyroscope <span>°/s, last 10 s</span></h2><canvas id="gchart"></canvas></section>
    <section class="card"><h2>Accelerometer <span>g, last 10 s</span></h2><canvas id="achart"></canvas></section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const COLORS = { x: '#e5484d', y: '#30a46c', z: '#3e63dd' };
const N = 100;                       // 10 s at 10 Hz
const hist = { g: [], a: [] };
let bias = { gx: 0, gy: 0, gz: 0 };  // gyro offsets captured by "Zero"
let recent = [];                     // last readings, to compute the bias
let yaw = 0, roll = 0, pitch = 0, lastT = 0, have = false;

function axisRow(el, label, unit) {
  el.innerHTML = ['x', 'y', 'z'].map(a =>
    `<div class="axis"><span class="k"><b style="background:${COLORS[a]}"></b>${label} ${a.toUpperCase()}</span>
     <div class="num" id="${label}${a}">0 ${unit}</div></div>`).join('');
}
axisRow($('gaxes'), 'Gyro', '°/s');
axisRow($('aaxes'), 'Accel', 'g');

$('zero').onclick = () => {
  if (recent.length) {
    const avg = k => recent.reduce((s, r) => s + r[k], 0) / recent.length;
    bias = { gx: avg('gx'), gy: avg('gy'), gz: avg('gz') };
  }
  yaw = 0;
};

function update(d) {
  const t = d.t;
  const gx = d.gx - bias.gx, gy = d.gy - bias.gy, gz = d.gz - bias.gz;
  const accRoll = Math.atan2(d.ay, d.az) * 180 / Math.PI;
  const accPitch = Math.atan2(-d.ax, Math.hypot(d.ay, d.az)) * 180 / Math.PI;
  const dt = have ? Math.min(Math.max(t - lastT, 0), 0.5) : 0;
  if (!have) { roll = accRoll; pitch = accPitch; }
  // complementary filter: gyro for quick moves, gravity to stop drift
  roll = 0.85 * (roll + gx * dt) + 0.15 * accRoll;
  pitch = 0.85 * (pitch + gy * dt) + 0.15 * accPitch;
  yaw += gz * dt;
  lastT = t; have = true;
  recent.push(d); if (recent.length > 20) recent.shift();

  $('board').style.transform = `rotateX(${55 + pitch}deg) rotateY(${roll}deg) rotateZ(${-yaw}deg)`;
  const f = v => Math.round(v);
  $('roll').innerHTML = `${f(roll)}<small>°</small>`;
  $('pitch').innerHTML = `${f(pitch)}<small>°</small>`;
  $('yaw').innerHTML = `${f(((yaw + 540) % 360) - 180)}<small>°</small>`;
  const spin = Math.hypot(gx, gy, gz);
  $('spin').innerHTML = `${f(spin)}<small>°/s</small>`;
  $('spinbar').style.width = Math.min(100, spin / 250 * 100) + '%';
  const shake = Math.abs(Math.hypot(d.ax, d.ay, d.az) - 1);
  $('shake').innerHTML = `${shake.toFixed(2)}<small>g</small>`;
  $('shakebar').style.width = Math.min(100, shake / 1 * 100) + '%';
  $('shakebox').classList.toggle('on', shake > 0.3);
  $('temp').innerHTML = `${d.temp.toFixed(1)}<small>°C</small>`;
  for (const a of ['x', 'y', 'z']) {
    $('Gyro' + a).textContent = `${(d['g' + a] - bias['g' + a]).toFixed(1)} °/s`;
    $('Accel' + a).textContent = `${d['a' + a].toFixed(2)} g`;
  }
  hist.g.push([gx, gy, gz]); hist.a.push([d.ax, d.ay, d.az]);
  if (hist.g.length > N) { hist.g.shift(); hist.a.shift(); }
  draw($('gchart'), hist.g, 250);
  draw($('achart'), hist.a, 2);
}

function draw(c, data, range) {
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  // autoscale, but never smaller than a sensible minimum so resting noise stays small
  let m = range / 8;
  for (const r of data) for (const v of r) m = Math.max(m, Math.abs(v));
  m *= 1.1;
  g.strokeStyle = '#e7e6e1'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  g.fillStyle = '#8a8a85'; g.font = '11px -apple-system, system-ui';
  g.fillText('+' + (m < 10 ? m.toFixed(1) : Math.round(m)), 4, 12);
  g.fillText('−' + (m < 10 ? m.toFixed(1) : Math.round(m)), 4, h - 4);
  ['x', 'y', 'z'].forEach((a, i) => {
    g.strokeStyle = COLORS[a]; g.lineWidth = 2; g.beginPath();
    data.forEach((r, j) => {
      const x = w - (data.length - 1 - j) * (w / (N - 1));
      const y = h / 2 - (r[i] / m) * (h / 2 - 6);
      j ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
  });
}

function setStatus(text, live) {
  $('statustext').textContent = text;
  $('dot').classList.toggle('live', live);
}

let lastSeen = 0;
const es = new EventSource('/events');
es.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.status === 'live' && d.t !== lastSeen) { lastSeen = d.t; update(d); setStatus('live · 10 readings/s', true); }
  else if (d.status && d.status !== 'live') setStatus(d.status, false);
  else if (Date.now() / 1000 - d.t > 2) setStatus('no readings (is imu_test running on the board?)', false);
};
es.onerror = () => setStatus('viewer stopped: run imu_view.py again', false);
</script>
</body>
</html>
